name: Authentication regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.85.1 --profile minimal
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: maturin build --locked --release --manifest-path rust_opaque_rs/Cargo.toml -o dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest -q
